<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found | Keyi Wang (王可逸)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B2635" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15110E" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/styles-optimized.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
                if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
            } catch (e) {}
        })();
    </script>
    <style>
        .notfound {
            max-width: var(--max-width-narrow);
            margin: 0 auto;
            padding: var(--space-2xl) var(--space-md);
            text-align: center;
        }
        .notfound-code {
            font-family: var(--font-display);
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--color-burgundy);
            margin-bottom: var(--space-sm);
        }
        .notfound-code .dot { color: var(--color-gold); }
        .notfound h1 {
            font-size: 1.6rem;
            margin-bottom: var(--space-sm);
        }
        .notfound p { color: var(--color-ink-light); margin-bottom: var(--space-lg); }
        .notfound-langs {
            font-size: 0.9rem;
            color: var(--color-ink-light);
            margin-bottom: var(--space-xl);
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--gradient-warm);
            color: #fff;
            font-weight: 600;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-md);
            transition: transform var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast);
        }
        .home-btn:hover { transform: translateY(-2px); color: #fff; text-decoration: none; box-shadow: var(--shadow-lg); }
        .home-btn::after { display: none !important; }
    </style>
</head>

<body>
    <header role="banner">
        <h1>Keyi Wang (王可逸)</h1>
        <p>2021 HDU CS → 2025 FDU CS</p>
    </header>

    <main id="main-content">
        <div class="notfound">
            <div class="notfound-code">404<span class="dot">.</span></div>
            <h1>This page wandered off.</h1>
            <p>The link may be broken, or the page may have moved.</p>
            <p class="notfound-langs">页面未找到 · Page not found · Sidan hittades inte</p>
            <a class="home-btn" href="/"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to home</a>
        </div>
    </main>

    <footer>
        <p>© <span id="year">2026</span> Keyi Wang (王可逸). All rights reserved.</p>
    </footer>

    <script>
        try { document.getElementById('year').textContent = new Date().getFullYear(); } catch (e) {}
    </script>
</body>

</html>
