name: Update live stats

# Refreshes assets/stats.json (Bilibili followers / collection views, Google
# Scholar citations) so the site never needs a manual number edit.
on:
  schedule:
    # Weekly, Monday 03:17 UTC. Off-the-hour to dodge scheduler congestion.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch stats
        env:
          BILIBILI_UID: '220871609'
          BILIBILI_SEASON_ID: '1560464'
          BILIBILI_FEATURED_BVID: 'BV18J3ezoEEj'
          SCHOLAR_ID: 'U_e6LikAAAAJ'
          # Optional: set this repository secret if Google Scholar starts
          # rate-limiting the runner. Without it the scraper is used alone.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/stats.json; then
            echo "No change in assets/stats.json"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          git commit -m "chore: refresh live stats [skip ci]"
          git push
