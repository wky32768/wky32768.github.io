name: Update Douban Top250

on:
  schedule:
    # Every month on the 1st, 11:23 Asia/Shanghai (03:23 UTC).
    - cron: '23 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-douban
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install beautifulsoup4 tzdata
      - name: Refresh both rankings and completed collections
        run: python scripts/update_douban.py
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- assets/douban.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/douban.json
          git commit -m "chore: refresh Douban Top250"
          git pull --rebase
          git push
