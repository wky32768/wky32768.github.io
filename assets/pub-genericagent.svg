<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="A verbose context compressed into a dense, token-efficient core by a self-evolving agent">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF8F3"/>
      <stop offset="1" stop-color="#F1E7DA"/>
    </linearGradient>
    <linearGradient id="burgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A63446"/>
      <stop offset="1" stop-color="#8B2635"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgG)"/>
  <rect x="10" y="10" width="1180" height="400" rx="14" fill="none" stroke="#E4D7C7" stroke-width="2"/>

  <!-- ===== LEFT: verbose context (many tokens, sparse signal) ===== -->
  <rect x="95" y="95" width="330" height="225" rx="14" fill="#fff" stroke="#E4D7C7" stroke-width="2"/>
  <g stroke-linecap="round">
    <line x1="120" y1="128" x2="380" y2="128" stroke="#CFC9BD" stroke-width="8"/>
    <line x1="120" y1="152" x2="300" y2="152" stroke="#C9A227" stroke-width="8"/>
    <line x1="120" y1="176" x2="350" y2="176" stroke="#CFC9BD" stroke-width="8"/>
    <line x1="120" y1="200" x2="240" y2="200" stroke="#CFC9BD" stroke-width="8"/>
    <line x1="120" y1="224" x2="320" y2="224" stroke="#CFC9BD" stroke-width="8"/>
    <line x1="120" y1="248" x2="270" y2="248" stroke="#6B7B6E" stroke-width="8"/>
    <line x1="120" y1="272" x2="360" y2="272" stroke="#CFC9BD" stroke-width="8"/>
    <line x1="120" y1="296" x2="210" y2="296" stroke="#CFC9BD" stroke-width="8"/>
  </g>
  <text x="260" y="348" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="600" fill="#5A6B5E" text-anchor="middle">verbose · redundant</text>

  <!-- ===== MIDDLE: maximize density ===== -->
  <text x="600" y="180" font-family="'Source Sans 3', sans-serif" font-size="17" font-weight="600" fill="#9A8420" text-anchor="middle">maximize density</text>
  <g stroke="#8B2635" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="548" y1="210" x2="648" y2="210"/>
    <polyline points="630,194 650,210 630,226"/>
  </g>

  <!-- ===== RIGHT: dense, token-efficient core ===== -->
  <!-- self-evolve loop -->
  <text x="865" y="98" font-family="'Source Sans 3', sans-serif" font-size="14" font-weight="600" fill="#6B7B6E" text-anchor="middle">self-evolve</text>
  <g fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round">
    <path d="M881 122 A16 16 0 1 1 865 106"/>
    <polyline points="857,101 865,106 861,115"/>
  </g>

  <rect x="780" y="150" width="170" height="120" rx="12" fill="url(#burgG)"/>
  <g>
    <rect x="800" y="168" width="20" height="20" rx="4" fill="#FDF3D6"/>
    <rect x="830" y="168" width="20" height="20" rx="4" fill="#E8C547"/>
    <rect x="860" y="168" width="20" height="20" rx="4" fill="#FDF3D6"/>
    <rect x="890" y="168" width="20" height="20" rx="4" fill="#E8C547"/>
    <rect x="920" y="168" width="20" height="20" rx="4" fill="#FDF3D6"/>
    <rect x="800" y="200" width="20" height="20" rx="4" fill="#E8C547"/>
    <rect x="830" y="200" width="20" height="20" rx="4" fill="#FDF3D6"/>
    <rect x="860" y="200" width="20" height="20" rx="4" fill="#E8C547"/>
    <rect x="890" y="200" width="20" height="20" rx="4" fill="#FDF3D6"/>
    <rect x="920" y="200" width="20" height="20" rx="4" fill="#E8C547"/>
    <rect x="800" y="232" width="20" height="20" rx="4" fill="#FDF3D6"/>
    <rect x="830" y="232" width="20" height="20" rx="4" fill="#E8C547"/>
    <rect x="860" y="232" width="20" height="20" rx="4" fill="#FDF3D6"/>
    <rect x="890" y="232" width="20" height="20" rx="4" fill="#E8C547"/>
    <rect x="920" y="232" width="20" height="20" rx="4" fill="#FDF3D6"/>
  </g>
  <text x="865" y="300" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="600" fill="#8B2635" text-anchor="middle">dense · token-efficient</text>
</svg>
