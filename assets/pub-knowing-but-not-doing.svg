<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="An LLM recognises all three discourse-level constraints but breaks two of them during generation">
  <defs>
    <linearGradient id="bgK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF8F3"/>
      <stop offset="1" stop-color="#F1E7DA"/>
    </linearGradient>
    <linearGradient id="sageK" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B7B6E"/>
      <stop offset="1" stop-color="#9AAF9F"/>
    </linearGradient>
    <linearGradient id="burgK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A63446"/>
      <stop offset="1" stop-color="#8B2635"/>
    </linearGradient>
    <filter id="softK" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#8B7A66" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bgK)"/>
  <rect x="10" y="10" width="1180" height="400" rx="14" fill="none" stroke="#E4D7C7" stroke-width="2"/>
  <circle cx="1135" cy="45" r="86" fill="#8B2635" opacity="0.035"/>
  <circle cx="65" cy="392" r="104" fill="#6B7B6E" opacity="0.045"/>

  <!-- ===== LEFT: the specification — every constraint is recognised ===== -->
  <rect x="60" y="86" width="440" height="248" rx="16" fill="#FFFFFF" filter="url(#softK)"/>
  <rect x="60" y="86" width="440" height="248" rx="16" fill="none" stroke="#D9E2D9" stroke-width="2"/>
  <text x="88" y="126" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#5A6B5E" letter-spacing="2">RECOGNITION</text>
  <text x="472" y="126" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#6B7B6E" text-anchor="end">3 / 3</text>
  <text x="88" y="150" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8B7A66">discourse-level constraints, all identified</text>

  <g>
    <rect x="88" y="176" width="300" height="20" rx="10" fill="#6B7B6E" opacity="0.10"/>
    <rect x="88" y="176" width="226" height="20" rx="10" fill="url(#sageK)" opacity="0.85"/>
    <circle cx="418" cy="186" r="15" fill="#FFFFFF" stroke="#6B7B6E" stroke-width="3"/>
    <path d="M410 186 l6 6 11 -13" fill="none" stroke="#6B7B6E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="88" y="226" width="300" height="20" rx="10" fill="#6B7B6E" opacity="0.10"/>
    <rect x="88" y="226" width="258" height="20" rx="10" fill="url(#sageK)" opacity="0.85"/>
    <circle cx="418" cy="236" r="15" fill="#FFFFFF" stroke="#6B7B6E" stroke-width="3"/>
    <path d="M410 236 l6 6 11 -13" fill="none" stroke="#6B7B6E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="88" y="276" width="300" height="20" rx="10" fill="#6B7B6E" opacity="0.10"/>
    <rect x="88" y="276" width="196" height="20" rx="10" fill="url(#sageK)" opacity="0.85"/>
    <circle cx="418" cy="286" r="15" fill="#FFFFFF" stroke="#6B7B6E" stroke-width="3"/>
    <path d="M410 286 l6 6 11 -13" fill="none" stroke="#6B7B6E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ===== CENTRE: the model ===== -->
  <g stroke="#8B2635" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8">
    <line x1="506" y1="210" x2="542" y2="210"/>
    <polyline points="532,200 542,210 532,220"/>
    <line x1="658" y1="210" x2="694" y2="210"/>
    <polyline points="684,200 694,210 684,220"/>
  </g>
  <circle cx="600" cy="210" r="50" fill="#FFFFFF" stroke="url(#burgK)" stroke-width="4" filter="url(#softK)"/>
  <text x="600" y="219" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#8B2635" text-anchor="middle">LLM</text>
  <text x="600" y="286" font-family="'Source Sans 3', sans-serif" font-size="14" letter-spacing="1.5" fill="#8B7A66" text-anchor="middle">GENERATION</text>

  <!-- ===== RIGHT: the output — only one constraint survives ===== -->
  <rect x="700" y="86" width="440" height="248" rx="16" fill="#FFFFFF" filter="url(#softK)"/>
  <rect x="700" y="86" width="440" height="248" rx="16" fill="none" stroke="#EBD9D2" stroke-width="2"/>
  <text x="728" y="126" font-family="'Source Sans 3', sans-serif" font-size="19" font-weight="700" fill="#8B2635" letter-spacing="2">ADHERENCE</text>
  <text x="1112" y="126" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#A63446" text-anchor="end">1 / 3</text>
  <text x="728" y="150" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#8B7A66">generated text, structure broken</text>

  <g>
    <!-- kept -->
    <rect x="728" y="176" width="300" height="20" rx="10" fill="#6B7B6E" opacity="0.10"/>
    <rect x="728" y="176" width="226" height="20" rx="10" fill="url(#sageK)" opacity="0.85"/>
    <circle cx="1058" cy="186" r="15" fill="#FFFFFF" stroke="#6B7B6E" stroke-width="3"/>
    <path d="M1050 186 l6 6 11 -13" fill="none" stroke="#6B7B6E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- broken in the middle -->
    <rect x="728" y="226" width="300" height="20" rx="10" fill="#8B2635" opacity="0.09"/>
    <rect x="728" y="226" width="152" height="20" rx="10" fill="url(#burgK)" opacity="0.78"/>
    <rect x="922" y="226" width="106" height="20" rx="10" fill="url(#burgK)" opacity="0.34"/>
    <path d="M884 219 l10 8 -9 8 11 7" fill="none" stroke="#8B2635" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1058" cy="236" r="15" fill="#FFFFFF" stroke="#A63446" stroke-width="3"/>
    <path d="M1051 229 l14 14 m0 -14 l-14 14" fill="none" stroke="#A63446" stroke-width="3" stroke-linecap="round"/>

    <!-- drifted out of alignment -->
    <rect x="728" y="276" width="300" height="20" rx="10" fill="#8B2635" opacity="0.09"/>
    <rect x="728" y="276" width="164" height="20" rx="10" fill="url(#burgK)" opacity="0.78"/>
    <path d="M892 286 q14 -18 28 -6" fill="none" stroke="#A63446" stroke-width="3" stroke-dasharray="4 5" stroke-linecap="round"/>
    <rect x="922" y="288" width="106" height="20" rx="10" fill="url(#burgK)" opacity="0.34"/>
    <circle cx="1058" cy="286" r="15" fill="#FFFFFF" stroke="#A63446" stroke-width="3"/>
    <path d="M1051 279 l14 14 m0 -14 l-14 14" fill="none" stroke="#A63446" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== caption ===== -->
  <line x1="286" y1="368" x2="470" y2="368" stroke="#C9A227" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
  <text x="600" y="375" font-family="Georgia, serif" font-size="22" font-style="italic" fill="#8B2635" text-anchor="middle">recognised, but not followed</text>
  <line x1="730" y1="368" x2="914" y2="368" stroke="#C9A227" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
</svg>
