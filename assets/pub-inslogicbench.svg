<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Argumentation logic flowing into a claim adjudication verdict">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF8F3"/>
      <stop offset="1" stop-color="#F1E7DA"/>
    </linearGradient>
    <linearGradient id="burg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A63446"/>
      <stop offset="1" stop-color="#8B2635"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect x="10" y="10" width="1180" height="400" rx="14" fill="none" stroke="#E4D7C7" stroke-width="2"/>

  <!-- Argumentation graph (premises -> argument) -->
  <g stroke="#6B7B6E" stroke-width="3" opacity="0.85">
    <line x1="180" y1="120" x2="330" y2="210"/>
    <line x1="160" y1="300" x2="330" y2="210"/>
    <line x1="340" y1="90" x2="330" y2="210"/>
    <line x1="330" y1="210" x2="520" y2="160"/>
    <line x1="330" y1="210" x2="520" y2="270"/>
  </g>
  <g>
    <circle cx="180" cy="120" r="26" fill="#fff" stroke="#C9A227" stroke-width="4"/>
    <circle cx="160" cy="300" r="26" fill="#fff" stroke="#6B7B6E" stroke-width="4"/>
    <circle cx="340" cy="90"  r="22" fill="#fff" stroke="#6B7B6E" stroke-width="4"/>
    <circle cx="330" cy="210" r="34" fill="url(#burg)"/>
    <circle cx="520" cy="160" r="24" fill="#fff" stroke="#C9A227" stroke-width="4"/>
    <circle cx="520" cy="270" r="24" fill="#fff" stroke="#6B7B6E" stroke-width="4"/>
  </g>
  <!-- entailment turnstile inside the central argument node -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round">
    <line x1="322" y1="194" x2="322" y2="226"/>
    <line x1="322" y1="210" x2="344" y2="210"/>
  </g>

  <!-- flow arrow -->
  <g stroke="#8B2635" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="600" y1="210" x2="690" y2="210"/>
    <polyline points="672,194 692,210 672,226"/>
  </g>

  <!-- Adjudication: shield + claim document with verdict check -->
  <g transform="translate(770,90)">
    <path d="M150 0 L300 36 V150 C300 230 230 280 150 312 C70 280 0 230 0 150 V36 Z" fill="url(#burg)"/>
    <rect x="78" y="74" width="150" height="170" rx="10" fill="#FDF8F3"/>
    <g stroke="#C9A227" stroke-width="6" stroke-linecap="round">
      <line x1="104" y1="112" x2="202" y2="112"/>
      <line x1="104" y1="142" x2="202" y2="142"/>
      <line x1="104" y1="172" x2="170" y2="172"/>
    </g>
    <circle cx="206" cy="206" r="40" fill="#6B7B6E"/>
    <polyline points="188,206 202,220 226,192" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
